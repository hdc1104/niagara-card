name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build.py
      - run: git diff --exit-code -- dist/niagara-card.js
      - run: node --check dist/niagara-card.js
      - run: python tools/check_browser.py
      - name: Check tag
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == 'v' + json.loads(Path('package.json').read_text())['version']
          PY
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/niagara-card.js --prerelease --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
